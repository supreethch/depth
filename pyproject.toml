[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-simulator"
version = "1.0.0"
description = "Decimal-precise hypothetical purchases against Gemini public order-book snapshots"
requires-python = ">=3.12"
dependencies = ["fastapi==0.135.1", "httpx==0.28.1", "uvicorn==0.41.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

